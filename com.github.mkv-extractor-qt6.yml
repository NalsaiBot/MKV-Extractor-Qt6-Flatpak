app-id: com.github.mkv-extractor-qt6
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: mkv-extractor-qt6
default-branch: stable
rename-icon: mkv-extractor-qt6
cleanup:
  - /bin/cmark
  - /gems
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc/libdvdcss/*.css
  - /share/doc/libdvdcss/*.html
  - /share/doc/libdvdcss/*.png
  - /share/man
  - '*.a'
  - '*.la'
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
modules:
  - name: mkvtoolnix
    buildsystem: simple
    build-commands:
      - ./configure --enable-optimization --enable-debug --prefix=/app --with-boost=/app
        --with-docbook-xsl-root=/usr/share/xml/docbook/xml/xsl-stylesheets --disable-update-check
        --with-qmake6=/usr/bin/qmake
      - ./drake -j $FLATPAK_BUILDER_N_JOBS
      - ./drake install
      - mkdir -p /app/share/doc/mkvtoolnix
      - install -m0644 -t/app/share/doc/mkvtoolnix AUTHORS CODE_OF_CONDUCT.md COPYING
        README.md
      - mkdir -p /app/share/doc/cmark
      - install -m0644 -t/app/share/doc/cmark COPYING README.md
    sources:
      - type: archive
        url: https://mkvtoolnix.download/sources/mkvtoolnix-102.0.tar.xz
        sha256: 9f0a810f17c7df8adb9064a3a41d5784399be412d19704cf080745ad7d45da30
        x-checker-data:
          type: anitya
          project-id: 1991
          stable-only: true
          url-template: https://mkvtoolnix.download/sources/mkvtoolnix-$version.tar.xz
    modules:
      - name: boost
        buildsystem: simple
        build-commands:
          - ./bootstrap.sh --prefix=/app --with-libraries=filesystem,system
          - ./b2 -j $FLATPAK_BUILDER_N_JOBS install
        sources:
          - type: archive
            url: https://archives.boost.io/release/1.92.0/source/boost_1_92_0.tar.bz2
            sha256: 5c1d40cb8e19adbf740a4ec2da35b3e58f3f5804b1dce44deb53df72193cbc6c
            x-checker-data:
              type: anitya
              project-id: 6845
              stable-only: true
              url-template: https://archives.boost.io/release/$major.$minor.$patch/source/boost_${major}_${minor}_$patch.tar.bz2
      - name: cmark
        buildsystem: cmake-ninja
        builddir: true
        config-opts:
          - -DCMAKE_BUILD_TYPE=RelWithDebInfo
          - -DCMARK_STATIC=OFF
        cleanup:
          - /bin
        sources:
          - type: archive
            url: https://github.com/commonmark/cmark/archive/refs/tags/0.31.2.tar.gz
            sha256: f9bc5ca38bcb0b727f0056100fac4d743e768872e3bacec7746de28f5700d697
            x-checker-data:
              type: anitya
              project-id: 9159
              stable-only: true
              url-template: https://github.com/commonmark/cmark/archive/refs/tags/$version.tar.gz
      - name: libdvdcss
        sources:
          - type: archive
            url: https://download.videolan.org/pub/libdvdcss/1.4.3/libdvdcss-1.4.3.tar.bz2
            sha256: 233cc92f5dc01c5d3a96f5b3582be7d5cee5a35a52d3a08158745d3d86070079
            x-checker-data:
              type: anitya
              project-id: 5568
              stable-only: true
              url-template: https://download.videolan.org/pub/libdvdcss/$version/libdvdcss-$version.tar.bz2
      - name: libdvdread
        sources:
          - type: archive
            url: https://download.videolan.org/pub/videolan/libdvdread/6.1.3/libdvdread-6.1.3.tar.bz2
            sha256: ce35454997a208cbe50e91232f0e73fb1ac3471965813a13b8730a8f18a15369
            x-checker-data:
              type: anitya
              project-id: 5614
              stable-only: true
              url-template: https://download.videolan.org/pub/videolan/libdvdread/$version/libdvdread-$version.tar.bz2
      - name: ruby
        config-opts:
          - --disable-install-doc
        sources:
          - type: archive
            url: https://cache.ruby-lang.org/pub/ruby/3.4/ruby-3.4.7.tar.gz
            sha256: 23815a6d095696f7919090fdc3e2f9459b2c83d57224b2e446ce1f5f7333ef36
        cleanup:
          - '*'

  - name: mkv-extractor-qt6
    buildsystem: simple
    build-commands:
      - bash -e build.sh
      - ln -s /app/share/mkv-extractor-qt6/MKVExtractorQt6.py /app/bin/mkv-extractor-qt6
      - install -Dm644 *.py -t /app/share/mkv-extractor-qt6
      - chmod +x /app/share/mkv-extractor-qt6/MKVExtractorQt6.py
      - install -Dm644 Languages/*.qm -t /app/share/mkv-extractor-qt6/Languages
      - install -Dm644 QFileDialogCustom/*.py QFileDialogCustom/*.qm -t /app/share/mkv-extractor-qt6/QFileDialogCustom
      - install -Dm644 WhatsUp/WhatsUp.py -t /app/share/mkv-extractor-qt6/WhatsUp
      - install -Dm644 img/* -t /app/share/mkv-extractor-qt6/img
      - install -Dm644 icons/mkv-extractor-qt6.png -t /app/share/icons/hicolor/256x256/apps
      - install -Dm644 man/mkv-extractor-qt6.1 man/mkv-extractor-qt6.fr.1 -t /app/share/man/man1
      - install -Dm644 mkv-extractor-qt6.desktop /app/share/applications/com.github.mkv-extractor-qt6.desktop
      - install -Dm644 com.github.mkv-extractor-qt6.metainfo.xml -t /app/share/metainfo
    sources:
      - type: git
        url: https://github.com/Hizoka76/MKV-Extractor-Qt6/
        tag: v26.04.29
        commit: f76f2ad15f8098983f87f33d87f32cb51f7f14d2
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$
      - type: shell
        commands:
          - sed -e 's|/usr/lib/x86_64-linux-gnu/qt6/bin/lrelease|/usr/bin/lrelease|g'
            -e 's|/usr/lib/i386-linux-gnu/qt6/bin/lrelease|/usr/bin/lrelease|g' -i
            build.sh
          - sed '/^### Génération de l.AppImage/,$d' -i build.sh
          - sed 's|BDSup2Sub.jar|bdsup2sub++|g' -i *.py
          - sed 's|^Icon=.*|Icon=mkv-extractor-qt6|' -i mkv-extractor-qt6.desktop
      - type: patch
        path: fix-command-execution.patch
      - type: file
        path: com.github.mkv-extractor-qt6.metainfo.xml
    modules:
      # PySide6 uses Qt private APIs: match the KDE runtime's Qt patch version.
      - name: pyside6
        buildsystem: simple
        build-commands:
          - python3 -m pip install --no-index --no-deps --prefix=/app *.whl
          # Use Qt from the KDE runtime instead of the wheel's bundled Qt libraries.
          - rm -rf /app/lib/python*/site-packages/PySide6/Qt/lib /app/lib/python*/site-packages/PySide6/Qt/plugins
          - ln -s /usr/lib/plugins /app/lib/python*/site-packages/PySide6/Qt/
        sources:
          - type: file
            url: https://files.pythonhosted.org/packages/a5/9a/f41bea4316d0c1bec4800842dcb4bd8fd3e29d6a79c496bc32e1aec42583/shiboken6-6.11.2-cp310-abi3-manylinux_2_34_x86_64.whl
            sha256: 7a7a0a72a9ed26c9bf77d42246b1c736486befb8f31aa2fb29957ea4cdd1c1c2
            only-arches: [x86_64]
          - type: file
            url: https://files.pythonhosted.org/packages/56/05/79ed0697515d4fc7435459e4ed4c4a3b5621a55b7c91d0f3f2cc3d617aa0/shiboken6-6.11.2-cp310-abi3-manylinux_2_39_aarch64.whl
            sha256: 4bbbd6fa4d7cff5ec5e12bc4c10e1d845fa30c89457ecb13cc64f7bddb77f6f9
            only-arches: [aarch64]
          - type: file
            url: https://files.pythonhosted.org/packages/0e/1a/84a84bbc75835ee88abdcb66eb875b8e1a21834af9b833bc1893f2c1bfaf/pyside6_essentials-6.11.2-cp310-abi3-manylinux_2_34_x86_64.whl
            sha256: aaf9f25f0f324874085fa5b26a610318db8a8e243cf85bb3e5400595191c7778
            only-arches: [x86_64]
          - type: file
            url: https://files.pythonhosted.org/packages/60/4c/d92b08a2151d095b9a3725fa0e71b215ec686d40bbd5d8b702d21a9b5eaa/pyside6_essentials-6.11.2-cp310-abi3-manylinux_2_39_aarch64.whl
            sha256: d3ec6e1885c46e57f16364f38ea8040ffc5dc0b18341058f608fede3ba930567
            only-arches: [aarch64]
      - name: imagemagick
        config-opts:
          - --enable-static=yes
          - --disable-docs
          - --with-png
          - --with-jpeg
          - --with-zlib
          - --enable-zero-configuration
        sources:
          - type: git
            url: https://github.com/ImageMagick/ImageMagick
            tag: 7.1.2-32
            commit: ad98b244c995d2e3051757fa3b7855f45b550d24
            x-checker-data:
              type: git
              tag-pattern: ^([\d.]+-\d+)$
      - name: bdsup2subpp
        buildsystem: simple
        build-commands:
          - qmake src/bdsup2sub++.pro
          - make -j $FLATPAK_BUILDER_N_JOBS
          - install -Dm755 bdsup2sub++ /app/bin/bdsup2sub++
        sources:
          - type: git
            url: https://github.com/TheGreatMcPain/BDSup2SubPlusPlus
            branch: qt6
            commit: 5613b6cb134523822d76b6d0f65a7e8746ee28d4
      - name: mkclean
        buildsystem: simple
        build-commands:
          - cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            ./
          - make
          - install -Dm755 mkclean/mkclean "/app/bin/mkclean"
          - install -Dm644 ReadMe.txt "/app/share/licenses/mkclean/License.txt"
        sources:
          - type: archive
            url: https://sourceforge.net/projects/matroska/files/mkclean/mkclean-0.9.0.tar.bz2
            sha256: 2f5cdcab0e09b65f9fef8949a55ef00ee3dd700e4b4050e245d442347d7cc3db
      - name: mkvalidator
        buildsystem: simple
        build-commands:
          - cmake -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/app -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            ./
          - make
          - install -Dm755 mkvalidator/mkvalidator "/app/bin/mkvalidator"
          - install -Dm644 ReadMe.txt "/app/share/licenses/mkvalidator/License.txt"
        sources:
          - type: archive
            url: https://sourceforge.net/projects/matroska/files/mkvalidator/mkvalidator-0.6.0.tar.bz2
            sha256: f9eaa2138fade7103e6df999425291d2947c5355294239874041471e3aa243f0
      - name: qtesseract5
        buildsystem: simple
        build-commands:
          - lrelease *.ts
          - pyrcc5 Qtesseract5Ressources.qrc -o Qtesseract5Ressources_rc.py
          - ln -s /app/share/qtesseract5/Qtesseract5.py /app/bin/qtesseract5
          - install -Dm755 Qtesseract5.py -t /app/share/qtesseract5
          - install -Dm644 Qtesseract5Ressources_rc.py langcodes.py Qtesseract5_en_EN.qm
            Qtesseract5_fr_FR.qm Qtesseract5_cs_CZ.qm -t /app/share/qtesseract5
          - install -Dm644 WhatsUp/WhatsUp.py -t /app/share/qtesseract5/WhatsUp
          - install -Dm644 man/qtesseract5.1 man/qtesseract5.fr.1 -t /app/share/man/man1
        sources:
          - type: git
            url: https://github.com/Hizoka76/QTesseract5
            commit: 40aecb5b00aabc36111b758464b73117a79f9bc5
            branch: main
        modules:
          - name: pyqt5
            buildsystem: simple
            build-commands:
              - python3 -m pip install --no-index --no-deps --prefix=/app *.whl
            sources:
              - type: file
                url: https://files.pythonhosted.org/packages/b4/8c/4065950f9d013c4b2e588fe33cf04e564c2322842d84dbcbce5ba1dc28b0/PyQt5-5.15.11-cp38-abi3-manylinux_2_17_x86_64.whl
                sha256: cd672a6738d1ae33ef7d9efa8e6cb0a1525ecf53ec86da80a9e1b6ec38c8d0f1
                only-arches: [x86_64]
              - type: file
                url: https://files.pythonhosted.org/packages/de/a0/dd9889ed9bf100d6d8b9d608b2689dc2a7f871f9489a0c563a8cf78c329f/pyqt5_qt5-5.15.19-py3-none-manylinux2014_x86_64.whl
                sha256: 31421d9c31fb29a8faee4b8b3c32658fb51a9e8c4c708075121162fa44faf80e
                only-arches: [x86_64]
              - type: file
                url: https://files.pythonhosted.org/packages/ea/9e/8b4f2ff7bbd118ea97a9e957642e19fd861e120e4b7ee7a183680794fc04/pyqt5_sip-12.19.0-cp313-cp313-manylinux_2_5_x86_64.manylinux1_x86_64.whl
                sha256: 16f31c35b767e45c017ce3966a48a57ff6e9a3cf9317b1e5bb71ac3cf3718e6b
                only-arches: [x86_64]
